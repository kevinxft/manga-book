<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漫书</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        background: #eef2f7;
        font-family: "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
          radial-gradient(at 50% 0%, hsla(220, 100%, 96%, 1) 0, transparent 50%),
          radial-gradient(at 100% 0%, hsla(230, 100%, 96%, 1) 0, transparent 50%);
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #boot-splash img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 28px;
        filter: drop-shadow(0 20px 48px rgba(59, 130, 246, 0.15));
        animation: splash-pulse 2.2s infinite ease-in-out;
        user-select: none;
        -webkit-user-drag: none;
      }

      #boot-splash .title {
        margin-top: 24px;
        font-size: 20px;
        font-weight: 600;
        color: #1e293b;
        letter-spacing: 0.2em;
        font-family: "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
        opacity: 0;
        animation: fade-in 0.8s ease forwards 0.3s;
      }

      #boot-splash .loader {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: fade-in 0.8s ease forwards 0.5s;
      }

      #boot-splash .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(59, 130, 246, 0.18);
        border-top-color: #3b82f6;
        border-radius: 999px;
        animation: loading-spin 0.9s linear infinite;
      }

      #boot-splash .loading-text {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #64748b;
      }

      #boot-splash .loader::after {
        content: "...";
        display: inline-block;
        width: 18px;
        overflow: hidden;
        vertical-align: bottom;
        color: #94a3b8;
        animation: loading-dots 1.2s steps(4, end) infinite;
      }

      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 20px 48px rgba(59, 130, 246, 0.15)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 25px 60px rgba(59, 130, 246, 0.25)); }
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes loading-dots {
        0% { width: 0; }
        100% { width: 18px; }
      }

      html.app-ready #boot-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="./build/icon.png" alt="漫书" onerror="this.onerror=null;this.src='../../../icon.png';" />
      <div class="title">漫书</div>
      <div class="loader">
        <span class="spinner" aria-hidden="true"></span>
        <span class="loading-text">Loading</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
