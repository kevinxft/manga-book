<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>漫书助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #27272a;
      background: #1f1f23;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fafafa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #27272a;
      color: #a1a1aa;
    }
    .badge.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .content {
      padding: 14px;
    }
    .current-page {
      background: #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .current-title {
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .dl-btn {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
      transition: opacity 0.2s;
    }
    .dl-btn:hover { opacity: 0.9; }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .task-section-title {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .task-card {
      background: #202024;
      border: 1px solid #2e2e33;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .task-name {
      font-weight: 600;
      color: #e4e4e7;
      font-size: 12px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-status {
      font-size: 11px;
      color: #a1a1aa;
      display: flex;
      justify-content: space-between;
    }
    .empty-tasks {
      color: #71717a;
      font-size: 12px;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 漫书助手</h1>
    <span id="conn-badge" class="badge">
      <span class="dot"></span>
      <span id="conn-text">检测中…</span>
    </span>
  </div>

  <div class="content">
    <div id="hitomi-panel" class="current-page" style="display: none;">
      <div id="page-gallery-title" class="current-title">检测到当前为 Hitomi 漫画</div>
      <button id="download-current-btn" class="dl-btn">📥 下载此漫画到漫书</button>
    </div>

    <div class="task-section-title">最近下载</div>
    <div id="task-list" class="task-list">
      <div class="empty-tasks">暂无下载记录</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
