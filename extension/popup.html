<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>漫书助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #1c1d22;
      color: #e5e7eb;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #2a2d35;
      background: #23252c;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #f3f4f6;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #2f323c;
      color: #9ca3af;
    }
    .badge.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .content {
      padding: 12px;
    }
    .current-page {
      background: #262932;
      border: 1px solid #343844;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .current-title {
      font-weight: 500;
      color: #d1d5db;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .dl-btn {
      width: 100%;
      padding: 7px 12px;
      background: #3b4559;
      color: #ffffff;
      border: 1px solid #29313e;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .dl-btn:hover { background: #4a5770; }
    .dl-btn:disabled { opacity: 0.6; cursor: default; }
    .task-section-title {
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
    }
    .task-card {
      background: #23262f;
      border: 1px solid #2f333f;
      border-radius: 4px;
      padding: 7px 9px;
    }
    .task-name {
      font-weight: 500;
      color: #e5e7eb;
      font-size: 12px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-status {
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }
    .empty-tasks {
      color: #6b7280;
      font-size: 12px;
      text-align: center;
      padding: 14px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>漫书助手</h1>
    <span id="conn-badge" class="badge">
      <span class="dot"></span>
      <span id="conn-text">检测中…</span>
    </span>
  </div>

  <div class="content">
    <div id="hitomi-panel" class="current-page" style="display: none;">
      <div id="page-gallery-title" class="current-title">检测到 Hitomi 漫画</div>
      <button id="download-current-btn" class="dl-btn">下载此漫画到漫书</button>
    </div>

    <div class="task-section-title">最近任务</div>
    <div id="task-list" class="task-list">
      <div class="empty-tasks">暂无下载记录</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
